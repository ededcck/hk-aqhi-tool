name: Sync Weather and Air Quality Data

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分鐘自動執行一次
  workflow_dispatch:      # 容許手動啟動

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 升級到 v4，解決 Node.js 20 警告

      - name: Download Data with Cache Busting
        run: |
          # 加入隨機數防止下載到舊嘅緩存資料
          curl -sL "https://www.aqhi.gov.hk/epd/ddata/html/out/24pc_ChT.xml?t=$(date +%s)" -o data.xml
          curl -sL "https://www.aqhi.gov.hk/epd/ddata/html/out/aqhi_ind_rss_ChT.xml?t=$(date +%s)" -o aqhi_index.xml
          curl -sL "https://www.hko.gov.hk/wxinfo/json/region.json?t=$(date +%s)" -o region.json

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.xml aqhi_index.xml region.json
          
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Auto sync: $(date +'%Y-%m-%d %H:%M:%S') Update"
            git push
          fi
