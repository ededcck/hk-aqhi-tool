<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港空氣監測</title>
    <style>
        :root { --p: #0056b3; --bg: #f0f2f5; --red: #d9534f; --white: #ffffff; --general: #17a2b8; --roadside: #6f42c1; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        .header-section { position: sticky; top: 0; background: var(--bg); z-index: 100; padding: 10px; border-bottom: 2px solid #ddd; text-align: center; }
        h1 { font-size: 1.3rem; margin: 5px 0; }
        select { padding: 12px; border: 2px solid var(--p); border-radius: 10px; font-size: 1rem; width: 100%; max-width: 400px; margin: 10px auto; display: block; }
        .status-bar { font-size: 0.85rem; color: #555; margin-top: 5px; line-height: 1.6; }
        #xml-date { font-weight: bold; color: #333; }
        #manual-time { color: var(--p); font-weight: bold; }
        #debug-info { color: var(--red); font-weight: bold; margin-top: 5px; font-size: 0.9rem; }
        
        /* 標籤與指數 */
        .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; color: white; margin-left: 5px; }
        .tag-general { background: var(--general); }
        .tag-roadside { background: var(--roadside); }
        .aqhi-val { font-weight: 900; font-size: 1.1rem; color: #333; }

        /* 表格樣式 */
        .desktop-view { background: var(--white); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: var(--p); color: white; font-size: 0.8rem; }
        .sub-label { display: block; font-size: 0.7rem; font-weight: normal; opacity: 0.9; }

        /* 卡片樣式 */
        .mobile-view { display: none; margin-top: 10px; }
        .station-card { background: var(--white); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-left: 8px solid #ccc; }
        .card-header { font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .item { text-align: center; padding: 8px 0; background: #fafafa; border-radius: 8px; }
        .label { font-size: 0.7rem; color: #666; display: block; margin-bottom: 2px; }
        .val { font-size: 1rem; font-weight: bold; }
        .exceed { color: var(--red); font-weight: bold; }

        @media (max-width: 768px) { .desktop-view { display: none; } .mobile-view { display: block; } }
    </style>

    <script>
        let latestData = {}; 
        let stationOrder = []; 
        const TH = { no2: 200, o3: 160, so2: 50, pm10: 100, pm25: 50 };

        async function loadData() {
            const debug = document.getElementById('debug-info');
            debug.innerText = "正在同步 AQHI 及污染物數據...";
            debug.style.display = "block";

            try {
                // 1. 同步讀取兩個 XML
                const [resPollutants, resAQHI] = await Promise.all([
                    fetch('data.xml?v=' + Date.now()),
                    fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.aqhi.gov.hk/epd/ddata/html/out/aqhi_ind_rss_ChT.xml'))
                ]);

                if (!resPollutants.ok) throw new Error("搵唔到污染物數據檔案 (data.xml)");
                
                // 解析污染物數據
                const txtP = await resPollutants.text();
                const xmlP = new DOMParser().parseFromString(txtP, "text/xml");
                const itemsP = xmlP.getElementsByTagName("PollutantConcentration");
                
                // 解析 AQHI 數據
                const txtA = await resAQHI.text();
                const xmlA = new DOMParser().parseFromString(txtA, "text/xml");
                const itemsA = xmlA.getElementsByTagName("item");

                const aqhiMap = {};
                for (let i = 0; i < itemsA.length; i++) {
                    const desc = itemsA[i].getElementsByTagName("description")[0].textContent;
                    // 正則提取：例如從 "中西區 : 3" 提取 "中西區" 同 "3"
                    const match = desc.match(/(.+) : (\d+)/);
                    if (match) aqhiMap[match[1].trim()] = match[2];
                }

                const tempMap = {}; 
                stationOrder = [];
                let maxDateObj = new Date(0);
                let maxDateStr = "-- --- ---- --:--";

                for (let i = 0; i < itemsP.length; i++) {
                    const name = itemsP[i].getElementsByTagName("StationName")[0].textContent;
                    const dateTimeStr = itemsP[i].getElementsByTagName("DateTime")[0].textContent;
                    const currentTime = new Date(dateTimeStr.replace(' +0800', ''));

                    if (currentTime > maxDateObj) {
                        maxDateObj = currentTime;
                        const parts = dateTimeStr.split(' ');
                        maxDateStr = `${parts[0]} ${parts[1]} ${parts[2]} ${parts[4].substring(0,5)}`;
                    }

                    if (!stationOrder.includes(name)) stationOrder.push(name);

                    if (!tempMap[name] || currentTime > tempMap[name].rawTime) {
                        tempMap[name] = {
                            name: name,
                            aqhi: aqhiMap[name] || "-",
                            rawTime: currentTime,
                            type: ["銅鑼灣", "中環", "旺角"].includes(name) ? "路邊" : "一般",
                            no2: itemsP[i].getElementsByTagName("二氧化氮")[0]?.textContent || "-",
                            o3:  itemsP[i].getElementsByTagName("臭氧")[0]?.textContent || "-",
                            so2: itemsP[i].getElementsByTagName("二氧化硫")[0]?.textContent || "-",
                            pm10: itemsP[i].getElementsByTagName("可吸入懸浮粒子")[0]?.textContent || "-",
                            pm25: itemsP[i].getElementsByTagName("細顆粒物")[0]?.textContent || "-"
                        };
                    }
                }

                latestData = tempMap;
                const selector = document.getElementById('station-selector');
                while (selector.options.length > 3) selector.remove(3);
                stationOrder.forEach(name => selector.add(new Option(name, name)));

                render('ALL');
                document.getElementById('xml-date').innerText = maxDateStr;
                document.getElementById('manual-time').innerText = new Date().toTimeString().split(' ')[0];
                debug.style.display = "none";
            } catch (e) {
                debug.innerText = "❌ 錯誤: " + e.message;
            }
        }

        function render(filter) {
            const tBody = document.getElementById('table-body');
            const mList = document.getElementById('mobile-list');
            let tHTML = '', mHTML = '';
            const fmt = (v, k) => (v !== "-" && parseFloat(v) > TH[k]) ? `<span class="exceed">${v}</span>` : v;

            stationOrder.forEach(name => {
                const d = latestData[name];
                if (!d || (filter !== 'ALL' && d.type !== filter && d.name !== filter)) return;

                const isRoad = d.type === "路邊";
                const tag = `<span class="tag ${isRoad?'tag-roadside':'tag-general'}">${d.type}</span>`;
                
                tHTML += `<tr>
                    <td><strong>${d.name}</strong></td><td>${tag}</td>
                    <td class="aqhi-val">${d.aqhi}</td>
                    <td>${fmt(d.no2,'no2')}</td><td>${fmt(d.o3,'o3')}</td><td>${fmt(d.so2,'so2')}</td>
                    <td>${fmt(d.pm10,'pm10')}</td><td>${fmt(d.pm25,'pm25')}</td>
                </tr>`;
                
                mHTML += `
                    <div class="station-card" style="border-left-color:${isRoad?'#6f42c1':'#17a2b8'}">
                        <div class="card-header">
                            <span>${d.name} ${tag}</span>
                            <span class="aqhi-val">AQHI: ${d.aqhi}</span>
                        </div>
                        <div class="grid">
                            <div class="item"><span class="label">二氧化氮 (NO₂)</span><span class="val">${fmt(d.no2,'no2')}</span></div>
                            <div class="item"><span class="label">臭氧 (O₃)</span><span class="val">${fmt(d.o3,'o3')}</span></div>
                            <div class="item"><span class="label">二氧化硫 (SO₂)</span><span class="val">${fmt(d.so2,'so2')}</span></div>
                            <div class="item"><span class="label">可吸入粒子 (PM₁₀)</span><span class="val">${fmt(d.pm10,'pm10')}</span></div>
                            <div class="item" style="grid-column: span 2;"><span class="label">細顆粒物 (PM₂.₅)</span><span class="val">${fmt(d.pm25,'pm25')}</span></div>
                        </div>
                    </div>`;
            });
            tBody.innerHTML = tHTML; mList.innerHTML = mHTML;
        }
        window.onload = loadData;
    </script>
</head>
<body>
    <div class="header-section">
        <h1>香港空氣監測</h1>
        <select id="station-selector" onchange="render(this.value)">
            <option value="ALL">--- 顯示所有地區 (按XML次序) ---</option>
            <option value="路邊">只看「路邊監測站」</option>
            <option value="一般">只看「一般監測站」</option>
        </select>
        <div class="status-bar">
            系統時間: <span id="xml-date">-- --- ---- --:--</span> | 
            <button onclick="loadData()" style="border:none;background:none;color:var(--p);font-weight:bold;cursor:pointer;">🔄 更新</button>
            [<span id="manual-time">--:--:--</span>]
            <div id="debug-info"></div>
        </div>
    </div>

    <div class="desktop-view">
        <table>
            <thead>
                <tr>
                    <th>測站</th><th>類型</th>
                    <th style="background:#444">AQHI<span class="sub-label">指數</span></th>
                    <th>二氧化氮<span class="sub-label">(NO₂)</span></th>
                    <th>臭氧<span class="sub-label">(O₃)</span></th>
                    <th>二氧化硫<span class="sub-label">(SO₂)</span></th>
                    <th>可吸入粒子<span class="sub-label">(PM₁₀)</span></th>
                    <th>細顆粒物<span class="sub-label">(PM₂.₅)</span></th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
    <div id="mobile-list" class="mobile-view"></div>
</body>
</html>
