<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港天氣及空氣監測</title>
    <style>
        :root { --p: #0056b3; --bg: #f0f2f5; --red: #d9534f; --white: #ffffff; --weather: #28a745; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        
        .header-section { position: sticky; top: 0; background: var(--bg); z-index: 1000; padding: 12px 10px; border-bottom: 2px solid #ddd; text-align: center; }
        select { padding: 12px; border: 2px solid var(--p); border-radius: 10px; font-size: 1rem; width: 100%; max-width: 400px; margin: 8px auto; display: block; background: white; }
        .status-bar { font-size: 0.8rem; color: #555; }
        
        /* 表格樣式 */
        .desktop-view { background: var(--white); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th, td { padding: 10px 5px; text-align: center; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        th { background: var(--p); color: white; white-space: nowrap; position: sticky; top: 0; }
        .weather-th { background: var(--weather) !important; }
        
        .exceed { color: var(--red); font-weight: bold; }
        .temp-val { color: var(--red); font-weight: bold; }

        /* 手機版卡片 */
        .mobile-view { display: none; margin-top: 10px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; border-left: 8px solid var(--p); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .item { background: #fafafa; padding: 5px; border-radius: 5px; text-align: center; border: 1px solid #eee; }
        .label { font-size: 0.6rem; color: #777; display: block; }
        .val { font-size: 0.9rem; font-weight: bold; }

        @media (max-width: 768px) { .desktop-view { display: none; } .mobile-view { display: block; } }
    </style>
</head>
<body>

<div class="header-section">
    <select id="main-selector" onchange="loadData()">
        <option value="WEATHER">--- 各區即時天氣 (最新) ---</option>
        <option value="AIR_24">--- 污染物 24 小時數據 (XML) ---</option>
    </select>
    <div class="status-bar">
        數據時間: <span id="data-time">讀取中...</span> | 
        <button onclick="loadData()" style="border:none;background:none;color:var(--p);font-weight:bold;cursor:pointer;">🔄 刷新</button>
    </div>
</div>

<div id="desktop-wrapper" class="desktop-view">
    <table>
        <thead id="t-head"></thead>
        <tbody id="t-body"></tbody>
    </table>
</div>
<div id="m-list" class="mobile-view"></div>

<script>
    const regionMap = {"HKA":"赤鱲角","CCH":"長洲","HPV":"跑馬地","HKO":"天文台","HKP":"香港公園","SE1":"啟德跑道公園","KSC":"滘西洲","KP":"京士柏","KLT":"九龍城","KTG":"觀塘","LFS":"流浮山","NGP":"昂坪","TYW":"北潭涌","PEN":"坪洲","SKG":"西貢","SHA":"沙田","SSP":"深水埗","SKW":"筲灣","SEK":"石崗","SSH":"上水","STY":"赤柱","TKL":"打鼓嶺","PLC":"大美督","TPO":"大埔","VP":"山頂","JKB":"將軍澳","TY1":"青衣","TWN":"荃灣可觀","TW":"荃灣門谷","TUN":"屯門","WGL":"橫瀾島","WLP":"濕地公園","HKS":"黃竹坑","WTS":"黃大仙","YLP":"元朗公園"};
    const TH = { no2: 200, o3: 160, so2: 50, co: 1000, pm10: 100, pm25: 50 };

    async function loadData() {
        const mode = document.getElementById('main-selector').value;
        const timeLabel = document.getElementById('data-time');
        const tHead = document.getElementById('t-head');
        const tBody = document.getElementById('t-body');
        const mList = document.getElementById('m-list');

        try {
            if (mode === 'WEATHER') {
                // --- 讀取各區即時天氣 (JSON) ---
                const res = await fetch('region.json?v=' + Date.now());
                const data = await res.json();
                
                // 修正：天文台 JSON 結構可能直接喺 root 或者喺 data 裡面
                const list = data.region || (data.weather ? data.weather.region : []);
                const btime = data.btime || "";
                
                timeLabel.innerText = btime ? `${btime.substring(6,8)} Mar, ${btime.substring(0,4)} ${btime.substring(8,10)}:${btime.substring(10,12)}` : "即時更新";

                tHead.innerHTML = `<tr><th class="weather-th">地區</th><th class="weather-th">氣溫</th><th class="weather-th">濕度</th><th class="weather-th">最高</th><th class="weather-th">最低</th><th class="weather-th">風速</th><th class="weather-th">氣壓</th></tr>`;
                
                let tb = '', mb = '';
                list.forEach(r => {
                    const name = regionMap[r.region] || r.region;
                    tb += `<tr><td><strong>${name}</strong></td><td class="temp-val">${r.temp}°C</td><td>${r.rh}%</td><td>${r.maxtemp}°C</td><td>${r.mintemp}°C</td><td>${r.speed||0}</td><td>${r.mslp||'-'}</td></tr>`;
                    mb += `<div class="card" style="border-color:var(--weather)"><div style="font-weight:bold;font-size:1.1rem;">${name} <span class="temp-val" style="float:right;">${r.temp}°C</span></div><div class="grid"><div class="item"><span class="label">濕度</span><span class="val">${r.rh}%</span></div><div class="item"><span class="label">最高/最低</span><span class="val">${r.maxtemp}/${r.mintemp}</span></div></div></div>`;
                });
                tBody.innerHTML = tb; mList.innerHTML = mb;

            } else {
                // --- 讀取 24 小時污染物 (XML) ---
                const [resP, resA] = await Promise.all([
                    fetch('data.xml?v=' + Date.now()),
                    fetch('aqhi_index.xml?v=' + Date.now())
                ]);
                const xmlP = new DOMParser().parseFromString(await resP.text(), "text/xml");
                const items = xmlP.getElementsByTagName("PollutantConcentration");
                
                timeLabel.innerText = "過去 24 小時紀錄 (XML)";
                tHead.innerHTML = `<tr><th>時間</th><th>測站</th><th>NO₂</th><th>O₃</th><th>SO₂</th><th>CO</th><th>PM₁₀</th><th>PM₂.₅</th></tr>`;

                let tb = '', mb = '';
                const fmt = (v, k) => (v !== "-" && parseFloat(v) > TH[k]) ? `<span class="exceed">${v}</span>` : v;

                // 24 小時數據通常好多，我哋全數列出
                for (let i = 0; i < items.length; i++) {
                    const name = items[i].getElementsByTagName("StationName")[0].textContent;
                    const time = items[i].getElementsByTagName("DateTime")[0].textContent.substring(0, 16);
                    const no2 = items[i].getElementsByTagName("二氧化氮")[0]?.textContent || "-";
                    const o3 = items[i].getElementsByTagName("臭氧")[0]?.textContent || "-";
                    const so2 = items[i].getElementsByTagName("二氧化硫")[0]?.textContent || "-";
                    const co = items[i].getElementsByTagName("一氧化碳")[0]?.textContent || "-";
                    const pm10 = items[i].getElementsByTagName("可吸入懸浮粒子")[0]?.textContent || "-";
                    const pm25 = items[i].getElementsByTagName("細顆粒物")[0]?.textContent || "-";

                    tb += `<tr><td>${time}</td><td><strong>${name}</strong></td><td>${fmt(no2,'no2')}</td><td>${fmt(o3,'o3')}</td><td>${fmt(so2,'so2')}</td><td>${fmt(co,'co')}</td><td>${fmt(pm10,'pm10')}</td><td>${fmt(pm25,'pm25')}</td></tr>`;
                    // 手機版只顯示最新嘅幾條或者簡化，費事太長
                    if (i < 20) {
                        mb += `<div class="card"><div style="font-size:0.7rem;color:#999;">${time}</div><div style="font-weight:bold;">${name}</div><div class="grid"><div class="item"><span class="label">NO₂/O₃</span><span class="val">${no2}/${o3}</span></div><div class="item"><span class="label">PM10/25</span><span class="val">${pm10}/${pm25}</span></div></div></div>`;
                    }
                }
                tBody.innerHTML = tb; mList.innerHTML = mb;
            }
        } catch (e) { 
            console.error(e);
            timeLabel.innerText = "讀取失敗，請檢查 GitHub 檔案是否存在";
        }
    }
    window.onload = loadData;
</script>
</body>
</html>
