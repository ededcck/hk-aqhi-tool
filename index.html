<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港即時天氣及空氣監測</title>
    <style>
        :root { --p: #0056b3; --bg: #f0f2f5; --red: #d9534f; --white: #ffffff; --general: #17a2b8; --roadside: #6f42c1; --weather: #28a745; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        .header-section { position: sticky; top: 0; background: var(--bg); z-index: 100; padding: 12px 10px; border-bottom: 2px solid #ddd; text-align: center; }
        .logo-link { display: inline-block; text-decoration: none; transition: opacity 0.2s; }
        .logo-link:hover { opacity: 0.8; }
        .main-logo { height: 40px; width: auto; max-width: 90%; margin-bottom: 5px; }
        
        select { padding: 12px; border: 2px solid var(--p); border-radius: 10px; font-size: 1rem; width: 100%; max-width: 400px; margin: 8px auto; display: block; background: white; outline: none; }
        .status-bar { font-size: 0.8rem; color: #555; line-height: 1.6; }
        
        /* 標籤樣式 */
        .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; color: white; margin-left: 5px; font-weight: normal; }
        .tag-general { background: var(--general); }
        .tag-roadside { background: var(--roadside); }
        
        .aqhi-container { display: flex; align-items: center; justify-content: center; min-height: 35px; }
        .aqhi-level-icon { height: 1.8rem; width: auto; vertical-align: middle; }
        
        /* 電腦版表格 */
        .desktop-view { background: var(--white); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th, td { padding: 10px 5px; text-align: center; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        th { background: var(--p); color: white; font-size: 0.75rem; white-space: nowrap; }
        .weather-th { background: var(--weather) !important; }
        .sub-label { display: block; font-size: 0.65rem; font-weight: normal; opacity: 0.9; }
        .exceed { color: var(--red); font-weight: bold; }
        .temp-val { color: var(--red); font-weight: bold; font-size: 1rem; }

        /* 手機版卡片 */
        .mobile-view { display: none; margin-top: 10px; }
        .station-card { background: var(--white); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-left: 8px solid #ccc; }
        .card-header { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .station-name-mobile { font-size: 1.2rem; font-weight: 800; color: #000; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .item { text-align: center; padding: 6px 0; background: #fafafa; border-radius: 8px; border: 1px solid #f0f0f0; }
        .label { font-size: 0.6rem; color: #666; display: block; margin-bottom: 2px; white-space: nowrap; }
        .val { font-size: 1rem; font-weight: bold; }

        @media (max-width: 768px) { .desktop-view { display: none; } .mobile-view { display: block; } .main-logo { height: 32px; } .aqhi-level-icon { height: 1.65rem; } }
    </style>
</head>
<body>

    <div class="header-section">
        <a href="https://www.aqhi.gov.hk/tc/index.html" target="_blank" class="logo-link">
            <img src="https://www.aqhi.gov.hk/common/images/logo_aqhi.svg" alt="AQHI Logo" class="main-logo">
        </a>
        <select id="main-selector" onchange="loadData()">
            <option value="WEATHER">--- 各區即時天氣 ---</option>
            <option value="ALL">顯示所有「空氣監測站」</option>
            <option value="路邊">只看「路邊監測站」</option>
            <option value="一般">只看「一般監測站」</option>
        </select>
        <div class="status-bar">
            數據時間: <span id="data-time">-- --- ---- --:--</span> | 
            <button onclick="loadData()" style="border:none;background:none;color:var(--p);font-weight:bold;cursor:pointer;">🔄 更新</button> 
            [<span id="manual-time">--:--:--</span>]
        </div>
    </div>

    <div id="desktop-wrapper" class="desktop-view">
        <table id="main-table">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div id="mobile-list" class="mobile-view"></div>

    <script>
        const regionMap = {"HKA":"赤鱲角","CCH":"長洲","HPV":"跑馬地","HKO":"天文台","HKP":"香港公園","SE1":"啟德跑道公園","KSC":"滘西洲","KP":"京士柏","KLT":"九龍城","KTG":"觀塘","LFS":"流浮山","NGP":"昂坪","TYW":"北潭涌","PEN":"坪洲","SKG":"西貢","SHA":"沙田","SSP":"深水埗","SKW":"筲灣","SEK":"石崗","SSH":"上水","STY":"赤柱","TKL":"打鼓嶺","PLC":"大美督","TPO":"大埔","VP":"山頂","JKB":"將軍澳","TY1":"青衣","TWN":"荃灣可觀","TW":"荃灣門谷","TUN":"屯門","WGL":"橫瀾島","WLP":"濕地公園","HKS":"黃竹坑","WTS":"黃大仙","YLP":"元朗公園"};
        const TH = { no2: 200, o3: 160, so2: 50, co: 1000, pm10: 100, pm25: 50 };
        
        function formatAQHI(rawStr) {
            if (!rawStr || rawStr === "-") return "-";
            const numMatch = rawStr.match(/(\d+)/);
            let level = numMatch ? parseInt(numMatch[0]) : 1;
            if (rawStr.includes("+") || rawStr.includes("嚴重") || level > 10) level = 11;
            return `<div class="aqhi-container"><img src="https://www.aqhi.gov.hk/common/images/icon/icon_legend_level_${level}.svg" class="aqhi-level-icon"></div>`;
        }

        function formatWeatherTime(raw) {
            if (!raw || raw.length < 12) return "-- --- ---- --:--";
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${raw.substring(6, 8)} ${months[parseInt(raw.substring(4, 6)) - 1]} ${raw.substring(0, 4)} ${raw.substring(8, 10)}:${raw.substring(10, 12)}`;
        }

        async function loadData() {
            const filter = document.getElementById('main-selector').value;
            const timeLabel = document.getElementById('data-time');
            const tHead = document.getElementById('table-head');
            const tBody = document.getElementById('table-body');
            const mList = document.getElementById('mobile-list');
            
            try {
                if (filter === 'WEATHER') {
                    // --- 處理天氣 ---
                    const res = await fetch('region.json?v=' + Date.now());
                    const json = await res.json();
                    timeLabel.innerText = formatWeatherTime(json.btime);
                    
                    tHead.innerHTML = `<tr><th class="weather-th">地區</th><th class="weather-th">氣溫</th><th class="weather-th">濕度</th><th class="weather-th">最高</th><th class="weather-th">最低</th><th class="weather-th">風速</th><th class="weather-th">陣風</th><th class="weather-th">氣壓</th></tr>`;
                    
                    let tb = '', mb = '';
                    json.region.forEach(r => {
                        const name = regionMap[r.region] || r.region;
                        tb += `<tr><td><strong>${name}</strong></td><td class="temp-val">${r.temp}°C</td><td>${r.rh}%</td><td>${r.maxtemp}°C</td><td>${r.mintemp}°C</td><td>${r.speed||0}km/h</td><td>${r.gust||'-'}</td><td>${r.mslp||'-'}</td></tr>`;
                        mb += `<div class="station-card" style="border-left-color:var(--weather)">
                            <div class="card-header"><div class="station-name-mobile">${name}</div><div class="temp-val">${r.temp}°C</div></div>
                            <div class="grid">
                                <div class="item"><span class="label">相對濕度</span><span class="val">${r.rh}%</span></div>
                                <div class="item"><span class="label">最高 / 最低</span><span class="val">${r.maxtemp}°C / ${r.mintemp}°C</span></div>
                                <div class="item"><span class="label">風速</span><span class="val">${r.speed||0} km/h</span></div>
                                <div class="item"><span class="label">海平面氣壓</span><span class="val">${r.mslp||'-'}</span></div>
                            </div></div>`;
                    });
                    tBody.innerHTML = tb; mList.innerHTML = mb;

                } else {
                    // --- 處理空氣 ---
                    const [resP, resA] = await Promise.all([
                        fetch('data.xml?v=' + Date.now()),
                        fetch('aqhi_index.xml?v=' + Date.now())
                    ]);
                    const xmlP = new DOMParser().parseFromString(await resP.text(), "text/xml");
                    const xmlA = new DOMParser().parseFromString(await resA.text(), "text/xml");
                    
                    const aqhiDescs = Array.from(xmlA.getElementsByTagName("description")).map(d => d.textContent);
                    const itemsP = xmlP.getElementsByTagName("PollutantConcentration");
                    
                    // 取得空氣更新時間
                    const dtStr = itemsP[0].getElementsByTagName("DateTime")[0].textContent;
                    const p = dtStr.split(' ');
                    timeLabel.innerText = `${p[0]} ${p[1]} ${p[2]} ${p[4].substring(0,5)}`;

                    tHead.innerHTML = `<tr><th>測站</th><th>類型</th><th style="background:#444; width:90px;">AQHI</th><th>二氧化氮<span class="sub-label">(NO₂)</span></th><th>臭氧<span class="sub-label">(O₃)</span></th><th>二氧化硫<span class="sub-label">(SO₂)</span></th><th>一氧化碳<span class="sub-label">(CO)</span></th><th>可吸入粒子<span class="sub-label">(PM₁₀)</span></th><th>細顆粒物<span class="sub-label">(PM₂.₅)</span></th></tr>`;

                    let tb = '', mb = '';
                    const fmt = (v, k) => (v !== "-" && parseFloat(v) > TH[k]) ? `<span class="exceed">${v}</span>` : v;

                    for (let i = 0; i < itemsP.length; i++) {
                        const name = itemsP[i].getElementsByTagName("StationName")[0].textContent.trim();
                        const type = ["銅鑼灣", "中環", "旺角"].includes(name) ? "路邊" : "一般";
                        if (filter !== 'ALL' && type !== filter && name !== filter) continue;

                        const rawAQHI = aqhiDescs.find(d => d.includes(name)) || "-";
                        const isRoad = type === "路邊";
                        const tag = `<span class="tag ${isRoad?'tag-roadside':'tag-general'}">${type}</span>`;
                        
                        const no2 = itemsP[i].getElementsByTagName("二氧化氮")[0]?.textContent || "-";
                        const o3 = itemsP[i].getElementsByTagName("臭氧")[0]?.textContent || "-";
                        const so2 = itemsP[i].getElementsByTagName("二氧化硫")[0]?.textContent || "-";
                        const co = itemsP[i].getElementsByTagName("一氧化碳")[0]?.textContent || "-";
                        const pm10 = itemsP[i].getElementsByTagName("可吸入懸浮粒子")[0]?.textContent || "-";
                        const pm25 = itemsP[i].getElementsByTagName("細顆粒物")[0]?.textContent || "-";

                        tb += `<tr><td><strong>${name}</strong></td><td>${tag}</td><td>${formatAQHI(rawAQHI)}</td><td>${fmt(no2,'no2')}</td><td>${fmt(o3,'o3')}</td><td>${fmt(so2,'so2')}</td><td>${fmt(co,'co')}</td><td>${fmt(pm10,'pm10')}</td><td>${fmt(pm25,'pm25')}</td></tr>`;
                        mb += `<div class="station-card" style="border-left-color:${isRoad?'#6f42c1':'#17a2b8'}">
                            <div class="card-header"><div class="station-name-mobile">${name} ${tag}</div><div>${formatAQHI(rawAQHI)}</div></div>
                            <div class="grid">
                                <div class="item"><span class="label">二氧化氮 NO₂</span><span class="val">${fmt(no2,'no2')}</span></div>
                                <div class="item"><span class="label">臭氧 O₃</span><span class="val">${fmt(o3,'o3')}</span></div>
                                <div class="item"><span class="label">二氧化硫 SO₂</span><span class="val">${fmt(so2,'so2')}</span></div>
                                <div class="item"><span class="label">一氧化碳 CO</span><span class="val">${fmt(co,'co')}</span></div>
                                <div class="item"><span class="label">可吸入粒子 PM₁₀</span><span class="val">${fmt(pm10,'pm10')}</span></div>
                                <div class="item"><span class="label">細顆粒物 PM₂.₅</span><span class="val">${fmt(pm25,'pm25')}</span></div>
                            </div></div>`;
                    }
                    tBody.innerHTML = tb; mList.innerHTML = mb;
                }
                document.getElementById('manual-time').innerText = new Date().toTimeString().split(' ')[0];
            } catch (e) { console.error(e); }
        }

        window.onload = loadData;
    </script>
</body>
</html>
