<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港天氣及空氣監測</title>
    <style>
        :root { --p: #0056b3; --bg: #f0f2f5; --white: #ffffff; --weather: #28a745; --general: #17a2b8; --roadside: #6f42c1; --red: #d9534f; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        .header-section { position: sticky; top: 0; background: var(--bg); z-index: 1000; padding: 10px; border-bottom: 2px solid #ddd; text-align: center; }
        select { padding: 12px; border: 2px solid var(--p); border-radius: 10px; width: 95%; max-width: 450px; display: block; margin: 5px auto; font-size: 1rem; background: white; cursor: pointer; }
        .status-bar { font-size: 0.85rem; color: #444; margin-top: 5px; font-weight: 500; }
        .update-btn { border:none; background:none; color:var(--p); font-weight:bold; cursor:pointer; text-decoration: underline; }

        .main-content { padding: 10px; max-width: 1200px; margin: 0 auto; }
        .desktop-view { background: var(--white); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; display: block; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #eee; }
        th { color: white; background: var(--p); position: sticky; top: 0; font-size: 0.85rem; }
        .weather-th { background: var(--weather) !important; }
        .region-bold { font-weight: bold; }
        .temp-val { color: var(--red); font-weight: bold; }

        .mobile-view { display: none; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 5px solid var(--p); }
        .weather-card { border-left-color: var(--weather); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem; }
        .card-label { color: #888; font-size: 0.75rem; }

        .aqhi-icon { height: 2rem; vertical-align: middle; }
        .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; color: white; }
        .exceed { color: var(--red); font-weight: bold; }

        @media (max-width: 768px) { .desktop-view { display: none; } .mobile-view { display: block; } }
    </style>
</head>
<body>

    <div class="header-section">
        <select id="main-selector" onchange="loadAndRender()">
            <option value="WEATHER">--- 各區即時天氣 ---</option>
            <option value="ALL">空氣監測站 (污染物+AQHI)</option>
            <option value="路邊">路邊監測站</option>
            <option value="一般">一般監測站</option>
        </select>
        <div class="status-bar">
            數據發布時間: <span id="data-time-label">讀取中...</span>
            <button class="update-btn" onclick="loadAndRender()">[🔄 立即更新]</button>
        </div>
    </div>

    <div class="main-content">
        <div id="desktop-display" class="desktop-view"></div>
        <div id="mobile-display" class="mobile-view"></div>
    </div>

    <script>
        const regionMap = {"HKA":"赤鱲角","CCH":"長洲","HPV":"跑馬地","HKO":"天文台","HKP":"香港公園","SE1":"啟德跑道公園","KSC":"滘西洲","KP":"京士柏","KLT":"九龍城","KTG":"觀塘","LFS":"流浮山","NGP":"昂坪","TYW":"北潭涌","PEN":"坪洲","SKG":"西貢","SHA":"沙田","SSP":"深水埗","SKW":"筲箕灣","SEK":"石崗","SSH":"上水","STY":"赤柱","TKL":"打鼓嶺","PLC":"大美督","TPO":"大埔","VP":"山頂","JKB":"將軍澳","TY1":"青衣","TWN":"荃灣可觀","TW":"荃灣城門谷","TUN":"屯門","WGL":"橫瀾島","WLP":"濕地公園","HKS":"黃竹坑","WTS":"黃大仙","YLP":"元朗公園"};
        const TH = { no2: 200, o3: 160, so2: 50, co: 1000, pm10: 100, pm25: 50 };
        
        let airData = {}, weatherData = { list: [], time: "" }, airTime = "";

        function formatBTime(raw) {
            if (!raw || raw.length < 12) return "時間不詳";
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${raw.substring(6, 8)} ${months[parseInt(raw.substring(4, 6)) - 1]}, ${raw.substring(0, 4)} ${raw.substring(8, 10)}:${raw.substring(10, 12)}`;
        }

        async function loadAndRender() {
            const filter = document.getElementById('main-selector').value;
            const timeLabel = document.getElementById('data-time-label');
            timeLabel.innerText = "更新中...";

            try {
                if (filter === 'WEATHER') {
                    const res = await fetch('region.json?v=' + Date.now());
                    const json = await res.json();
                    weatherData = { list: json.region, time: formatBTime(json.btime) };
                    timeLabel.innerText = weatherData.time;
                } else {
                    const [resA, resAQ] = await Promise.all([
                        fetch('data.xml?v=' + Date.now()),
                        fetch('aqhi_index.xml?v=' + Date.now())
                    ]);
                    
                    const parser = new DOMParser();
                    const aqXml = parser.parseFromString(await resAQ.text(), "text/xml");
                    airTime = aqXml.getElementsByTagName("pubDate")[0]?.textContent || "實時";
                    const aqDescs = Array.from(aqXml.getElementsByTagName("description")).map(d => d.textContent);

                    const airXml = parser.parseFromString(await resA.text(), "text/xml");
                    const items = airXml.getElementsByTagName("PollutantConcentration");
                    airData = {};
                    for (let i = 0; i < items.length; i++) {
                        const name = items[i].getElementsByTagName("StationName")[0].textContent.trim();
                        airData[name] = {
                            name, rawAQHI: aqDescs.find(d => d.includes(name)) || "-",
                            type: ["銅鑼灣", "中環", "旺角"].includes(name) ? "路邊" : "一般",
                            no2: items[i].getElementsByTagName("二氧化氮")[0]?.textContent || "-",
                            o3: items[i].getElementsByTagName("臭氧")[0]?.textContent || "-",
                            so2: items[i].getElementsByTagName("二氧化硫")[0]?.textContent || "-",
                            co: items[i].getElementsByTagName("一氧化碳")[0]?.textContent || "-",
                            pm10: items[i].getElementsByTagName("可吸入懸浮粒子")[0]?.textContent || "-",
                            pm25: items[i].getElementsByTagName("細顆粒物")[0]?.textContent || "-"
                        };
                    }
                    timeLabel.innerText = airTime;
                }
                render(filter);
            } catch (e) { 
                console.error(e);
                timeLabel.innerText = "讀取失敗 (請確保 GitHub 已完成一次 Sync)";
            }
        }

        function getAQHIIcon(raw) {
            if (!raw || raw === "-") return "-";
            let lv = (raw.match(/(\d+)/) || [1])[0];
            if (raw.includes("+") || raw.includes("嚴重") || parseInt(lv) > 10) lv = 11;
            return `<img src="https://www.aqhi.gov.hk/common/images/icon/icon_legend_level_${lv}.svg" class="aqhi-icon">`;
        }

        function render(filter) {
            const dDiv = document.getElementById('desktop-display');
            const mDiv = document.getElementById('mobile-display');
            let dH = '', mH = '';

            if (filter === 'WEATHER') {
                dH = `<table><thead><tr><th class="weather-th">地區</th><th class="weather-th">氣溫</th><th class="weather-th">濕度</th><th class="weather-th">風速</th><th class="weather-th">最高</th><th class="weather-th">最低</th><th class="weather-th">陣風</th><th class="weather-th">氣壓</th></tr></thead><tbody>`;
                weatherData.list.forEach(r => {
                    const name = regionMap[r.region] || r.region;
                    dH += `<tr><td class="region-bold">${name}</td><td class="temp-val">${r.temp}°C</td><td>${r.rh}%</td><td>${r.speed||0}km/h</td><td>${r.maxtemp}°C</td><td>${r.mintemp}°C</td><td>${r.gust||'-'}</td><td>${r.mslp||'-'}</td></tr>`;
                    mH += `<div class="card weather-card"><div class="card-header"><span class="card-title">${name}</span><span class="temp-val">${r.temp}°C</span></div><div class="card-grid"><div class="card-item"><span class="card-label">相對濕度</span><span>${r.rh}%</span></div><div class="card-item"><span class="card-label">最高/最低</span><span>${r.maxtemp}°C / ${r.mintemp}°C</span></div><div class="card-item"><span class="card-label">風速</span><span>${r.speed||0}km/h</span></div><div class="card-item"><span class="card-label">氣壓</span><span>${r.mslp||'-'}</span></div></div></div>`;
                });
                dDiv.innerHTML = dH + `</tbody></table>`;
            } else {
                dH = `<table><thead><tr><th>監測站</th><th>AQHI</th><th>NO₂</th><th>O₃</th><th>SO₂</th><th>CO</th><th>PM₁₀</th><th>PM₂.₅</th></tr></thead><tbody>`;
                const fmt = (v, k) => (v !== "-" && parseFloat(v) > TH[k]) ? `<span class="exceed">${v}</span>` : v;
                Object.values(airData).forEach(d => {
                    if (filter !== 'ALL' && d.type !== filter && d.name !== filter) return;
                    dH += `<tr><td class="region-bold">${d.name} <span class="tag ${d.type==='路邊'?'tag-roadside':'tag-general'}">${d.type}</span></td><td>${getAQHIIcon(d.rawAQHI)}</td><td>${fmt(d.no2,'no2')}</td><td>${fmt(d.o3,'o3')}</td><td>${fmt(d.so2,'so2')}</td><td>${fmt(d.co,'co')}</td><td>${fmt(d.pm10,'pm10')}</td><td>${fmt(d.pm25,'pm25')}</td></tr>`;
                    mH += `<div class="card"><div class="card-header"><span class="card-title">${d.name} <span class="tag ${d.type==='路邊'?'tag-roadside':'tag-general'}">${d.type}</span></span>${getAQHIIcon(d.rawAQHI)}</div><div class="card-grid"><div class="card-item"><span class="card-label">NO₂ / O₃</span><span>${fmt(d.no2,'no2')} / ${fmt(d.o3,'o3')}</span></div><div class="card-item"><span class="card-label">SO₂ / CO</span><span>${fmt(d.so2,'so2')} / ${fmt(d.co,'co')}</span></div><div class="card-item"><span class="card-label">PM₁₀ / PM₂.₅</span><span>${fmt(d.pm10,'pm10')} / ${fmt(d.pm25,'pm25')}</span></div></div></div>`;
                });
                dDiv.innerHTML = dH + `</tbody></table>`;
            }
            mDiv.innerHTML = mH;
        }

        window.onload = loadAndRender;
    </script>
</body>
</html>
