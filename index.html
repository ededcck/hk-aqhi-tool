<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港空氣監測 - 穩定修復版</title>
    <style>
        :root { 
            --p: #0056b3; --bg: #f0f2f5; --red: #d9534f; --btn: #28a745; --white: #ffffff;
            --general: #17a2b8; --roadside: #6f42c1;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        
        .header-section { position: sticky; top: 0; background: var(--bg); z-index: 100; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
        h1 { text-align: center; font-size: 1.4rem; margin: 10px 0; }
        
        .search-container { display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin: 0 auto 10px; }
        #search-input { padding: 12px; border: 2px solid #ddd; border-radius: 25px; font-size: 1rem; outline: none; }

        .filter-group { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 12px; border: none; border-radius: 15px; background: #ddd; cursor: pointer; font-size: 0.85rem; }
        .filter-btn.active { background: var(--p); color: white; }

        .status-bar { text-align: center; font-size: 0.8rem; color: #666; margin: 10px 0; }

        /* 標籤 */
        .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; color: white; margin-left: 5px; }
        .tag-general { background: var(--general); }
        .tag-roadside { background: var(--roadside); }

        /* 電腦版表格 */
        .desktop-view { background: var(--white); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; display: block; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: var(--p); color: white; }

        /* 手機版卡片 */
        .mobile-view { display: none; }
        .station-card { background: var(--white); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-left: 5px solid #ccc; }
        .card-header { font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .item { text-align: center; padding: 6px 0; background: #fafafa; border-radius: 8px; }
        .label { font-size: 0.65rem; color: #888; display: block; }
        .val { font-size: 0.9rem; font-weight: 600; }
        .exceed { color: var(--red); font-weight: bold; }

        @media (max-width: 768px) {
            .desktop-view { display: none; }
            .mobile-view { display: block; }
        }
    </style>
</
