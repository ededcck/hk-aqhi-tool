<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港即時空氣污染物監測</title>
    <style>
        :root { 
            --p: #0056b3; 
            --bg: #f8f9fa; 
            --red: #d9534f; 
            --btn: #28a745;
            --btn-hover: #218838;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); padding: 15px; color: #333; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
        
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        #refresh-btn {
            background-color: var(--btn);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #refresh-btn:hover { background-color: var(--btn-hover); }
        #refresh-btn:active { transform: scale(0.95); }
        #refresh-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        .status-box { font-size: 0.9rem; color: #666; }
        #update-time { color: var(--p); font-weight: bold; }

        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 15px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: var(--p); color: white; white-space: nowrap; position: sticky; top: 0; }
        .exceed { color: var(--red); font-weight: bold; }
        
        @media (max-width: 600px) {
            .controls { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <h1>香港各區污染物濃度 (μg/m³)</h1>

    <div class="controls">
        <button id="refresh-btn" onclick="loadData()">🔄 立即更新</button>
        <div class="status-box">
            <span id="status-msg">正在載入 GitHub 數據...</span><br>
            網頁最後更新：<span id="update-time">--:--:--</span>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>測站</th>
                    <th>數據時間 (EPD)</th>
                    <th>NO₂</th>
                    <th>O₃</th>
                    <th>SO₂</th>
                    <th>CO</th>
                    <th>PM₁₀</th>
                    <th>PM₂.₅</th>
                </tr>
            </thead>
            <tbody id="list">
                <tr><td colspan="8">數據載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // 超標標準
        const TH = { no2: 200, o3: 160, so2: 50, co: 10000, pm10: 100, pm25: 50 };

        function fmt(v, t) {
            let n = parseFloat(v);
            return (!isNaN(n) && n > TH[t]) ? `<span class="exceed">${v}</span>` : v;
        }

        async function loadData() {
            const btn = document.getElementById('refresh-btn');
            const statusMsg = document.getElementById('status-msg');
            const updateTimeSpan = document.getElementById('update-time');
            const list = document.getElementById('list');

            btn.disabled = true;
            statusMsg.innerText = "正在讀取最新數據...";

            try {
                // 加一個隨機參數防止 Browser Cache 舊嘅 data.xml
                const res = await fetch('data.xml?v=' + Date.now());
                if(!res.ok) throw new Error('未搵到數據檔 (請確保 Action 已經執行過一次)');
                
                const txt = await res.text();
                const xml = new DOMParser().parseFromString(txt, "text/xml");
                const items = xml.getElementsByTagName("PollutantConcentration");
                
                if (items.length === 0) throw new Error('XML 格式不正確或未有數據');

                const map = {};
                for (let i = 0; i < items.length; i++) {
                    const s = items[i].getElementsByTagName("StationName")[0].textContent;
                    map[s] = {
                        t: items[i].getElementsByTagName("DateTime")[0].textContent.replace(' +0800', ''),
                        no2: items[i].getElementsByTagName("二氧化氮")[0].textContent,
                        o3:  items[i].getElementsByTagName("臭氧")[0].textContent,
                        so2: items[i].getElementsByTagName("二氧化硫")[0].textContent,
                        co:  items[i].getElementsByTagName("一氧化碳")[0].textContent,
                        pm10: items[i].getElementsByTagName("可吸入懸浮粒子")[0].textContent,
                        pm25: items[i].getElementsByTagName("細顆粒物")[0].textContent
                    };
                }

                list.innerHTML = '';
                Object.keys(map).sort().forEach(k => {
                    const d = map[k];
                    list.innerHTML += `<tr>
                        <td><strong>${k}</strong></td>
                        <td style="font-size:0.85em; color:#666">${d.t}</td>
                        <td>${fmt(d.no2,'no2')}</td>
                        <td>${fmt(d.o3,'o3')}</td>
                        <td>${fmt(d.so2,'so2')}</td>
                        <td>${fmt(d.co,'co')}</td>
                        <td>${fmt(d.pm10,'pm10')}</td>
                        <td>${fmt(d.pm25,'pm25')}</td>
                    </tr>`;
                });

                statusMsg.innerText = "數據已由 GitHub 同步";
                updateTimeSpan.innerText = new Date().toLocaleTimeString();
            } catch (e) {
                statusMsg.innerText = "讀取失敗: " + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        // 首次開啟網頁自動執行
        loadData();

        // 依然保留 15 分鐘自動刷新網頁內容的功能
        setInterval(loadData, 900000);
    </script>
</body>
</html>
