<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港即時天氣及空氣質素監測</title>
    <style>
        :root { --p: #0056b3; --bg: #f0f2f5; --white: #ffffff; --weather: #28a745; --general: #17a2b8; --roadside: #6f42c1; --red: #d9534f; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        
        .header-section { position: sticky; top: 0; background: var(--bg); z-index: 100; padding: 10px; border-bottom: 2px solid #ddd; text-align: center; }
        select { padding: 12px; border: 2px solid var(--p); border-radius: 10px; width: 100%; max-width: 450px; display: block; margin: 5px auto; font-size: 1rem; background: white; cursor: pointer; outline: none; }
        .status-bar { font-size: 0.8rem; color: #666; margin-top: 5px; }

        .view-container { background: var(--white); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th, td { padding: 10px 5px; text-align: center; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        th { color: white; background: var(--p); position: sticky; top: 0; white-space: nowrap; }
        
        /* 天氣表專用顏色 */
        .weather-th { background: var(--weather) !important; }
        .region-bold { font-weight: bold; color: #000; }
        .temp-val { color: var(--red); font-weight: bold; }
        
        /* 空氣表專用樣式 */
        .aqhi-container { display: flex; align-items: center; justify-content: center; min-height: 35px; }
        .aqhi-level-icon { height: 1.8rem; width: auto; vertical-align: middle; }
        .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; color: white; margin-left: 5px; font-weight: normal; }
        .tag-general { background: var(--general); }
        .tag-roadside { background: var(--roadside); }
        .exceed { color: var(--red); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-section">
        <select id="main-selector" onchange="render()">
            <option value="WEATHER">--- 各區即時天氣 ---</option>
            <option value="ALL">顯示所有空氣監測站 (污染物+AQHI)</option>
            <option value="路邊">只看路邊空氣監測站</option>
            <option value="一般">只看一般空氣監測站</option>
        </select>
        <div class="status-bar">
            數據時間: <span id="data-time-label">-- ---, ---- --:--</span> | 
            手動更新: <span id="manual-time">--:--:--</span>
            <button onclick="loadData()" style="border:none; background:none; color:var(--p); font-weight:bold; cursor:pointer; margin-left:5px;">[🔄 刷新數據]</button>
        </div>
    </div>

    <div id="data-display">
        <div class="view-container" style="padding:50px; text-align:center;">
            正在從 GitHub 讀取數據...<br>
            <span style="font-size:0.8rem;color:#777;">(如長時間無反應，請確保 GitHub Actions 已成功執行過一次sync。)</span>
        </div>
    </div>

    <script>
        const regionMap = {
            "HKA":"赤鱲角","CCH":"長洲","HPV":"跑馬地","HKO":"天文台","HKP":"香港公園","SE1":"啟德跑道公園","KSC":"滘西洲","KP":"京士柏","KLT":"九龍城","KTG":"觀塘","LFS":"流浮山","NGP":"昂坪","TYW":"北潭涌","PEN":"坪洲","SKG":"西貢","SHA":"沙田","SSP":"深水埗","SKW":"筲箕灣","SEK":"石崗","SSH":"上水","STY":"赤柱","TKL":"打鼓嶺","PLC":"大美督","TPO":"大埔","VP":"山頂","JKB":"將軍澳","TY1":"青衣","TWN":"荃灣可觀","TW":"荃灣城門谷","TUN":"屯門","WGL":"橫瀾島","WLP":"濕地公園","HKS":"黃竹坑","WTS":"黃大仙","YLP":"元朗公園"
        };

        let airData = {}, weatherData = { list: [], btime: "" };
        const TH = { no2: 200, o3: 160, so2: 50, co: 1000, pm10: 100, pm25: 50 };

        // 原本漏咗嘅 AQHI Icon 顯示函數
        function formatAQHI(rawStr) {
            if (!rawStr || rawStr === "-") return "-";
            const numMatch = rawStr.match(/(\d+)/);
            const isPlus = rawStr.includes("+");
            const isSerious = rawStr.includes("嚴重");
            if (!numMatch) return "-";
            let level = parseInt(numMatch[0]);
            if (isPlus || isSerious || level > 10) level = 11;
            else if (level < 1) level = 1;
            const iconUrl = `https://www.aqhi.gov.hk/common/images/icon/icon_legend_level_${level}.svg`;
            return `<div class="aqhi-container"><img src="${iconUrl}" class="aqhi-level-icon" alt="Level ${level}"></div>`;
        }

        // 格式化 btime 為 29 Mar, 2026 03:40
        function formatBTime(raw) {
            if (!raw || raw.length < 12) return "-- ---, ---- --:--";
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${raw.substring(6, 8)} ${months[parseInt(raw.substring(4, 6)) - 1]}, ${raw.substring(0, 4)} ${raw.substring(8, 10)}:${raw.substring(10, 12)}`;
        }

        async function loadData() {
            try {
                // 讀取 GitHub Repo 入面嘅三個檔案 (加上時間戳避免快取)
                const [resAir, resAQHI, resWeather] = await Promise.all([
                    fetch('data.xml?v=' + Date.now()),
                    fetch('aqhi_index.xml?v=' + Date.now()),
                    fetch('region.json?v=' + Date.now())
                ]);

                // 1. 處理天氣 JSON
                const wJson = await resWeather.json();
                weatherData = { list: wJson.region, btime: formatBTime(wJson.btime) };

                // 2. 處理 AQHI XML (原本漏咗嘅)
                const aqXmlText = await resAQHI.text();
                const parser = new DOMParser();
                const aqXml = parser.parseFromString(aqXmlText, "text/xml");
                const descSource = Array.from(aqXml.getElementsByTagName("description")).map(d => d.textContent);

                // 3. 處理空氣污染物 XML (含一氧化碳)
                const airXmlText = await resAir.text();
                const airXml = parser.parseFromString(airXmlText, "text/xml");
                const items = airXml.getElementsByTagName("PollutantConcentration");
                
                airData = {};
                for (let i = 0; i < items.length; i++) {
                    const name = items[i].getElementsByTagName("StationName")[0].textContent.trim();
                    
                    // 匹配 AQHI (原本漏咗嘅匹配邏輯)
                    let rawAQHI = descSource.find(d => d.includes(name)) || "-";

                    airData[name] = {
                        name,
                        aqhiHtml: formatAQHI(rawAQHI), // Icon 顯示
                        type: ["銅鑼灣", "中環", "旺角"].includes(name) ? "路邊" : "一般",
                        no2: items[i].getElementsByTagName("二氧化氮")[0]?.textContent || "-",
                        o3: items[i].getElementsByTagName("臭氧")[0]?.textContent || "-",
                        so2: items[i].getElementsByTagName("二氧化硫")[0]?.textContent || "-",
                        co: items[i].getElementsByTagName("一氧化碳")[0]?.textContent || "-", // 新增回 CO
                        pm10: items[i].getElementsByTagName("可吸入懸浮粒子")[0]?.textContent || "-",
                        pm25: items[i].getElementsByTagName("細顆粒物")[0]?.textContent || "-"
                    };
                }

                render();
                document.getElementById('manual-time').innerText = new Date().toLocaleTimeString();
            } catch (e) {
                console.error("數據加載失敗:", e);
                document.getElementById('data-display').innerHTML = `<div style="color:red; text-align:center; padding:20px;">無法讀取數據。<br>數據時間：${new Date().toLocaleTimeString()}<br><br>請確保您已經將檔案 push 上 GitHub，並且 `.github/workflows/sync.yml` 已經成功執行過一次。<br><br>在本地（file://）直接打開 HTML 檔通常會因為 CORS 限制而無法顯示天氣資料。</div>`;
            }
        }

        function render() {
            const filter = document.getElementById('main-selector').value;
            const container = document.getElementById('data-display');
            const timeLabel = document.getElementById('data-time-label');

            if (filter === 'WEATHER') {
                timeLabel.innerText = weatherData.btime;
                let html = `<div class="view-container"><table><thead><tr>
                    <th class="weather-th">地區</th><th class="weather-th">氣溫</th><th class="weather-th">濕度</th>
                    <th class="weather-th">風向</th><th class="weather-th">風速</th><th class="weather-th">最高</th>
                    <th class="weather-th">最低</th><th class="weather-th">陣風</th><th class="weather-th">氣壓</th><th class="weather-th">草溫</th>
                </tr></thead><tbody>`;
                
                weatherData.list.forEach(r => {
                    const name = regionMap[r.region] || r.region;
                    html += `<tr>
                        <td class="region-bold">${name}</td>
                        <td class="temp-val">${r.temp?r.temp+'°C':'-'}</td>
                        <td>${r.rh?r.rh+'%':'-'}</td>
                        <td>${r.wind || '-'}</td>
                        <td>${r.speed ?? '-'}</td>
                        <td>${r.maxtemp?r.maxtemp+'°C':'-'}</td>
                        <td>${r.mintemp?r.mintemp+'°C':'-'}</td>
                        <td>${r.gust ?? '-'}</td>
                        <td>${r.mslp ?? '-'}</td>
                        <td>${r.grasstemp?r.grasstemp+'°C':'-'}</td>
                    </tr>`;
                });
                container.innerHTML = html + `</tbody></table></div>`;
            } else {
                timeLabel.innerText = "空氣污染即時數據 (含 AQHI 指數)";
                // 在 Header 加回 AQHI 指數，並確保一氧化碳 CO 欄位存在
                let html = `<div class="view-container"><table><thead><tr>
                    <th>監測站</th><th>類型</th><th style="background:#444;">AQHI</th><th>NO₂</th><th>O₃</th><th>SO₂</th><th>CO</th><th>PM₁₀</th><th>PM₂.₅</th>
                </tr></thead><tbody>`;
                
                // 超標高亮格式化
                const fmt = (v, k) => (v !== "-" && parseFloat(v) > TH[k]) ? `<span class="exceed">${v}</span>` : v;

                Object.values(airData).forEach(d => {
                    if (filter !== 'ALL' && d.type !== filter && d.name !== filter) return;
                    html += `<tr>
                        <td class="region-cell region-bold">${d.name}</td>
                        <td><span class="tag ${d.type==='路邊'?'tag-roadside':'tag-general'}">${d.type}</span></td>
                        <td>${d.aqhiHtml}</td> <td>${fmt(d.no2,'no2')}</td><td>${fmt(d.o3,'o3')}</td><td>${fmt(d.so2,'so2')}</td><td>${fmt(d.co,'co')}</td><td>${fmt(d.pm10,'pm10')}</td><td>${fmt(d.pm25,'pm25')}</td>
                    </tr>`;
                });
                container.innerHTML = html + `</tbody></table></div>`;
            }
        }

        window.onload = loadData;
        // 每 10 分鐘自動嘗試重新整理頁面數據
        setInterval(loadData, 600000);
    </script>
</body>
</html>
