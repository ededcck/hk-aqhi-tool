<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港空氣監測及各區天氣</title>
    <style>
        :root { --p: #0056b3; --bg: #f0f2f5; --red: #d9534f; --white: #ffffff; --general: #17a2b8; --roadside: #6f42c1; --weather: #28a745; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        .header-section { position: sticky; top: 0; background: var(--bg); z-index: 100; padding: 12px 10px; border-bottom: 2px solid #ddd; text-align: center; }
        .logo-link { display: inline-block; text-decoration: none; transition: opacity 0.2s; }
        .logo-link:hover { opacity: 0.8; }
        .main-logo { height: 40px; width: auto; max-width: 90%; margin-bottom: 5px; }
        select { padding: 12px; border: 2px solid var(--p); border-radius: 10px; font-size: 1rem; width: 100%; max-width: 400px; margin: 8px auto; display: block; background: white; outline: none; }
        .status-bar { font-size: 0.8rem; color: #555; line-height: 1.6; }
        
        .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; color: white; margin-left: 5px; font-weight: normal; }
        .tag-general { background: var(--general); }
        .tag-roadside { background: var(--roadside); }
        .aqhi-container { display: flex; align-items: center; justify-content: center; min-height: 35px; }
        .aqhi-level-icon { height: 1.8rem; width: auto; vertical-align: middle; }
        
        .desktop-view { background: var(--white); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 10px 5px; text-align: center; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        th { background: var(--p); color: white; font-size: 0.75rem; white-space: nowrap; }
        .sub-label { display: block; font-size: 0.65rem; font-weight: normal; opacity: 0.9; }
        .exceed { color: var(--red); font-weight: bold; }
        .temp-val { color: var(--red); font-weight: bold; }

        .mobile-view { display: none; margin-top: 10px; }
        .station-card { background: var(--white); border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); border-left: 8px solid #ccc; }
        .card-header { border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .station-name-mobile { font-size: 1.1rem; font-weight: 800; color: #000; }
        
        /* 手機版排位優化 */
        .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 8px; }
        .item { text-align: center; padding: 6px 4px; background: #fafafa; border-radius: 8px; border: 1px solid #f0f0f0; }
        .label { font-size: 0.65rem; color: #777; display: block; margin-bottom: 2px; }
        .val { font-size: 0.95rem; font-weight: bold; }

        @media (max-width: 768px) { .desktop-view { display: none; } .mobile-view { display: block; } .main-logo { height: 32px; } .aqhi-level-icon { height: 1.65rem; } }
    </style>

    <script>
        let latestData = {}; 
        let stationOrder = []; 
        const TH = { no2: 200, o3: 160, so2: 50, co: 1000, pm10: 100, pm25: 50 };
        const regionMap = {"hka":"赤鱲角","cch":"長洲","hpv":"跑馬地","hko":"天文台","hkp":"香港公園","se1":"啟德跑道公園","ksc":"滘西洲","kp":"京士柏","klt":"九龍城","ktg":"觀塘","lfs":"流浮山","ngp":"昂坪","tyw":"北潭涌","pen":"坪洲","skg":"西貢","sha":"沙田","ssp":"深水埗","skw":"筲箕灣","sek":"石崗","ssh":"上水","sty":"赤柱","tkl":"打鼓嶺","plc":"大美督","tpo":"大埔","vp1":"山頂","jkb":"將軍澳","ty1":"青衣","twn":"荃灣可觀","tw":"荃灣門谷","tun":"屯門","wgl":"橫瀾島","wlp":"濕地公園","hks":"黃竹坑","wts":"黃大仙","ylp":"元朗公園","cwb":"清水灣","tms":"大帽山","tc":"東涌","tls":"大老山"};

        function formatAQHI(rawStr) {
            if (!rawStr || rawStr === "-") return "-";
            const numMatch = rawStr.match(/(\d+)/);
            let level = numMatch ? parseInt(numMatch[0]) : 1;
            if (rawStr.includes("+") || rawStr.includes("嚴重") || level > 10) level = 11;
            const iconUrl = `https://www.aqhi.gov.hk/common/images/icon/icon_legend_level_${level}.svg`;
            return `<div class="aqhi-container"><img src="${iconUrl}" class="aqhi-level-icon"></div>`;
        }

        async function loadData() {
            const mode = document.getElementById('station-selector').value;
            const timeLabel = document.getElementById('xml-date');
            try {
                if (mode === 'WEATHER') {
                    const res = await fetch('region.json?v=' + Date.now());
                    const json = await res.json();
                    timeLabel.innerText = "最後更新: " + json.btime;
                    renderWeather(json.datas);
                } else {
                    const [resP, resA] = await Promise.all([
                        fetch('data.xml?v=' + Date.now()),
                        fetch('aqhi_index.xml?v=' + Date.now())
                    ]);
                    const xmlP = new DOMParser().parseFromString(await resP.text(), "text/xml");
                    const xmlA = new DOMParser().parseFromString(await resA.text(), "text/xml");
                    
                    const aqhiSource = Array.from(xmlA.getElementsByTagName("item")).map(i => i.getElementsByTagName("description")[0]?.textContent || "");
                    const itemsP = xmlP.getElementsByTagName("PollutantConcentration");
                    
                    let maxDateStr = "-- --- ---- --:--", maxDateObj = new Date(0);
                    stationOrder = [];
                    latestData = {};

                    for (let i = 0; i < itemsP.length; i++) {
                        const name = itemsP[i].getElementsByTagName("StationName")[0].textContent.trim();
                        const dtStr = itemsP[i].getElementsByTagName("DateTime")[0].textContent;
                        const cTime = new Date(dtStr.replace(' +0800', ''));

                        if (cTime > maxDateObj) {
                            maxDateObj = cTime;
                            const p = dtStr.split(' ');
                            maxDateStr = `${p[0]} ${p[1]} ${p[2]} ${p[4].substring(0,5)}`;
                        }
                        if (!stationOrder.includes(name)) stationOrder.push(name);

                        let rawAQHI = aqhiSource.find(desc => desc.includes(name)) || "-";
                        latestData[name] = {
                            name, aqhiHtml: formatAQHI(rawAQHI), type: ["銅鑼灣", "中環", "旺角"].includes(name) ? "路邊" : "一般",
                            no2: itemsP[i].getElementsByTagName("二氧化氮")[0]?.textContent || "-",
                            o3: itemsP[i].getElementsByTagName("臭氧")[0]?.textContent || "-",
                            so2: itemsP[i].getElementsByTagName("二氧化硫")[0]?.textContent || "-",
                            co: itemsP[i].getElementsByTagName("一氧化碳")[0]?.textContent || "-",
                            pm10: itemsP[i].getElementsByTagName("可吸入懸浮粒子")[0]?.textContent || "-",
                            pm25: itemsP[i].getElementsByTagName("細顆粒物")[0]?.textContent || "-"
                        };
                    }
                    timeLabel.innerText = maxDateStr;
                    renderAQHI(mode);
                }
                document.getElementById('manual-time').innerText = new Date().toTimeString().split(' ')[0];
            } catch (e) { console.error(e); }
        }

        function renderAQHI(filter) {
            const tHead = document.getElementById('table-head');
            const tBody = document.getElementById('table-body');
            const mList = document.getElementById('mobile-list');
            tHead.innerHTML = `<tr><th>測站</th><th>類型</th><th style="background:#444;">AQHI</th><th>NO₂</th><th>O₃</th><th>SO₂</th><th>CO</th><th>PM₁₀</th><th>PM₂.₅</th></tr>`;
            let tHTML = '', mHTML = '';
            const fmt = (v, k) => (v !== "-" && parseFloat(v) > TH[k]) ? `<span class="exceed">${v}</span>` : v;
            stationOrder.forEach(name => {
                const d = latestData[name];
                if (!d || (filter !== 'AQHI' && d.type !== filter)) return;
                const isRoad = d.type === "路邊", tag = `<span class="tag ${isRoad?'tag-roadside':'tag-general'}">${d.type}</span>`;
                tHTML += `<tr><td><strong>${d.name}</strong></td><td>${tag}</td><td>${d.aqhiHtml}</td><td>${fmt(d.no2,'no2')}</td><td>${fmt(d.o3,'o3')}</td><td>${fmt(d.so2,'so2')}</td><td>${fmt(d.co,'co')}</td><td>${fmt(d.pm10,'pm10')}</td><td>${fmt(d.pm25,'pm25')}</td></tr>`;
                mHTML += `<div class="station-card" style="border-left-color:${isRoad?'#6f42c1':'#17a2b8'}">
                    <div class="card-header"><div class="station-name-mobile">${d.name} ${tag}</div><div>${d.aqhiHtml}</div></div>
                    <div class="grid">
                        <div class="item"><span class="label">NO₂ / O₃</span><span class="val">${fmt(d.no2,'no2')} / ${fmt(d.o3,'o3')}</span></div>
                        <div class="item"><span class="label">SO₂ / CO</span><span class="val">${fmt(d.so2,'so2')} / ${fmt(d.co,'co')}</span></div>
                        <div class="item"><span class="label">PM₁₀</span><span class="val">${fmt(d.pm10,'pm10')}</span></div>
                        <div class="item"><span class="label">PM₂.₅</span><span class="val">${fmt(d.pm25,'pm25')}</span></div>
                    </div></div>`;
            });
            tBody.innerHTML = tHTML; mList.innerHTML = mHTML;
        }

        function renderWeather(datas) {
            const tHead = document.getElementById('table-head');
            const tBody = document.getElementById('table-body');
            const mList = document.getElementById('mobile-list');
            tHead.innerHTML = `<tr><th style="background:var(--weather)">地區</th><th style="background:var(--weather)">氣溫</th><th style="background:var(--weather)">濕度</th><th style="background:var(--weather)">最高</th><th style="background:var(--weather)">最低</th><th style="background:var(--weather)">風向</th><th style="background:var(--weather)">風速</th><th style="background:var(--weather)">氣壓</th><th style="background:var(--weather)">-</th></tr>`;
            let tHTML = '', mHTML = '';
            datas.forEach(row => {
                const name = regionMap[row[0]] || row[0].toUpperCase();
                if (!row[1]) return;
                // row[1]:temp, row[2]:rh, row[3]:windDir, row[4]:windSpeed, row[5]:max, row[6]:min, row[9]:mslp
                tHTML += `<tr><td><strong>${name}</strong></td><td class="temp-val">${row[1]}°C</td><td>${row[2]}%</td><td>${row[5]}°C</td><td>${row[6]}°C</td><td>${row[3]}</td><td>${row[4]} km/h</td><td>${row[9]||'-'}</td><td>-</td></tr>`;
                mHTML += `<div class="station-card" style="border-left-color:var(--weather)">
                    <div class="card-header"><div class="station-name-mobile">${name}</div><div class="temp-val" style="font-size:1.3rem;">${row[1]}°C</div></div>
                    <div class="grid">
                        <div class="item"><span class="label">最高 / 最低</span><span class="val">${row[5]}° / ${row[6]}°</span></div>
                        <div class="item"><span class="label">相對濕度</span><span class="val">${row[2]}%</span></div>
                        <div class="item"><span class="label">風速 (風向)</span><span class="val">${row[4]} km/h (${row[3]||'-'})</span></div>
                        <div class="item"><span class="label">海平面氣壓</span><span class="val">${row[9]||'-'} hPa</span></div>
                    </div></div>`;
            });
            tBody.innerHTML = tHTML; mList.innerHTML = mHTML;
        }
        window.onload = loadData;
    </script>
</head>
<body>
    <div class="header-section">
        <a href="https://www.aqhi.gov.hk/tc/index.html" target="_blank" class="logo-link">
            <img src="https://www.aqhi.gov.hk/common/images/logo_aqhi.svg" class="main-logo">
        </a>
        <select id="station-selector" onchange="loadData()">
            <option value="AQHI">--- 污染物數據 (XML) ---</option>
            <option value="路邊">只看「路邊監測站」</option>
            <option value="一般">只看「一般監測站」</option>
            <option value="WEATHER">--- 各區即時天氣 (JSON) ---</option>
        </select>
        <div class="status-bar">
            數據時間: <span id="xml-date">讀取中...</span> | 
            <button onclick="loadData()" style="border:none;background:none;color:var(--p);font-weight:bold;cursor:pointer;">🔄 更新</button> 
            [<span id="manual-time">--:--:--</span>]
        </div>
    </div>
    <div class="desktop-view">
        <table>
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
    <div id="mobile-list" class="mobile-view"></div>
</body>
</html>
